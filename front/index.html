<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Responsive / mobile browser configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Primary document metadata -->
  <title>Scav</title>
  <meta name="description"
    content="Scav is a fast, lightweight web application designed for responsive client-side navigation and reliable performance." />
  <meta name="author" content="Scav Team" />

  <!-- Adaptive browser status bar color -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />

  <!-- Prevent automatic phone/email detection from changing the UI -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://indium.netlify.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://indium.netlify.app/" />
  <meta property="og:title" content="Scav" />
  <meta property="og:description"
    content="A fast, lightweight web application built for responsive navigation and reliable performance." />
  <meta property="og:image" content="https://indium.netlify.app/assets/preview.png" />
  <meta property="og:image:alt" content="Scav application preview" />
  <meta property="og:site_name" content="Scav" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://indium.netlify.app/" />
  <meta name="twitter:title" content="Scav" />
  <meta name="twitter:description"
    content="A fast, lightweight web application built for responsive navigation and reliable performance." />
  <meta name="twitter:image" content="https://indium.netlify.app/assets/preview.png" />
  <meta name="twitter:image:alt" content="Scav application preview" />

  <!-- PWA / application -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Scav" />

  <!-- Icons -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" sizes="192x192" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- Backend connection -->
  <link rel="dns-prefetch" href="https://thresher-o6i4.onrender.com" />
  <link rel="preconnect" href="https://thresher-o6i4.onrender.com" crossorigin />

  <!-- Critical stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Main application module preload and script -->
  <link rel="modulepreload" href="/src/app.ts" />
  <script type="module" src="/src/app.ts"></script>

  <!-- Dynamic SPA Head Utility -->
  <script>
    (() => {
      "use strict";

      const SITE_BASE_URL = "https://indium.netlify.app";

      window.updateHeadTag = (key, value, attr = "content") => {
        if (!key || value == null) return;

        const stringKey = String(key);
        const stringValue = String(value);

        // 1. Handle Document Title
        if (stringKey === "title") {
          document.title = stringValue;
          return;
        }

        // 2. Handle Canonical URL
        if (stringKey === "canonical") {
          let canonicalLink = document.querySelector('link[rel="canonical"]');
          if (!canonicalLink) {
            canonicalLink = document.createElement("link");
            canonicalLink.setAttribute("rel", "canonical");
            document.head.appendChild(canonicalLink);
          }

          const fullUrl = stringValue.startsWith("http")
            ? stringValue
            : `${SITE_BASE_URL}${stringValue.startsWith("/") ? "" : "/"}${stringValue}`;

          canonicalLink.setAttribute("href", fullUrl);
          return;
        }

        // 3. Handle Metadata Tags (Description, Open Graph, Twitter)
        let element = null;

        try {
          element = document.querySelector(stringKey);
        } catch {
          element = null;
        }

        if (!element) {
          const escapedKey = window.CSS?.escape
            ? CSS.escape(stringKey)
            : stringKey.replace(/"/g, '\\"');

          element = document.querySelector(
            `meta[name="${escapedKey}"], meta[property="${escapedKey}"]`
          );
        }

        if (!element) {
          element = document.createElement("meta");
          element.setAttribute(
            stringKey.startsWith("og:") ? "property" : "name",
            stringKey
          );
          document.head.appendChild(element);
        }

        element.setAttribute(attr, stringValue);
      };
    })();
  </script>
</head>

<body>
  <!-- Accessibility Skip Link -->
  <a href="#content" class="sr-only focusable">Skip to main content</a>

  <noscript>
    <div class="noscript-message" role="alert">
      <h1>JavaScript is required</h1>
      <p>
        Please enable JavaScript in your browser settings to use Scav.
      </p>
    </div>
  </noscript>

  <!-- Application shell populated dynamically by SPA router -->
  <div id="app" class="app">
    <header id="pageheader" class="pageheader" role="banner"></header>

    <nav id="primary-nav" class="primary-nav" aria-label="Main navigation"></nav>

    <div id="secnav" class="secnav" role="region" aria-label="Secondary navigation" aria-live="polite"></div>

    <main id="content" class="content-main" tabindex="-1" aria-live="polite"></main>

    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="modalcon" role="region" aria-live="polite" aria-atomic="true"></div>

    <footer id="pagefooter" class="pagefooter" role="contentinfo"></footer>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>You're Offline | Farmium</title>

  <meta name="description"
    content="Farmium is temporarily offline. Check your connection or use the offline tools while your network is restored." />

  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Farmium" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" sizes="192x192" />

  <style>
    :root {
      color-scheme: light dark;

      --accent: #4285f4;
      --accent-dark: #3367d6;
      --success: #34a853;

      --background: #f7f8fa;
      --surface: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;

      --radius: 14px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.5;
      color: var(--text);
      background: var(--background);
    }

    .offline-page {
      width: min(100%, 620px);
      text-align: center;
    }

    .offline-card {
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .offline-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: #e8f0fe;
      font-size: 2rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      line-height: 1.2;
    }

    .message {
      max-width: 500px;
      margin: 0 auto;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;

      margin-top: 1.25rem;
      padding: 0.45rem 0.75rem;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d93025;
    }

    .status.online .status-dot {
      background: var(--success);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;

      margin-top: 1.75rem;
    }

    .button {
      min-width: 150px;
      min-height: 46px;
      padding: 0.7rem 1.1rem;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;

      border: 0;
      border-radius: 10px;

      font: inherit;
      font-weight: 600;
      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background-color 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:focus-visible {
      outline: 3px solid rgba(66, 133, 244, 0.35);
      outline-offset: 2px;
    }

    .button-primary {
      color: #fff;
      background: var(--accent);
    }

    .button-primary:hover {
      background: var(--accent-dark);
    }

    .button-secondary {
      color: #fff;
      background: var(--success);
    }

    .button-secondary:hover {
      opacity: 0.9;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-note {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }

      .button:hover,
      .button:active {
        transform: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #202124;
        --surface: #292a2d;
        --text: #f1f3f4;
        --muted: #bdc1c6;
        --border: #3c4043;
      }

      .offline-icon {
        background: #303f5f;
      }
    }
  </style>
</head>

<body>
  <main class="offline-page">
    <section class="offline-card" aria-labelledby="offline-title">

      <div class="offline-icon" aria-hidden="true">
        🔌
      </div>

      <h1 id="offline-title">You're offline</h1>

      <p class="message">
        Farmium can't reach the network right now.
        Your connection will be checked again automatically.
      </p>

      <div id="connectionStatus" class="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Offline</span>
      </div>

      <div class="actions">
        <button id="retryBtn" class="button button-primary" type="button">
          🔄 Try again
        </button>

        <a href="/offWork.html" class="button button-secondary">
          🎮 Open OffWork
        </a>
      </div>

      <p class="footer-note">
        If you already opened Farmium recently, some content may still
        be available offline.
      </p>

      <p id="announcement" class="sr-only" aria-live="assertive"></p>
    </section>
  </main>

  <script>
    (() => {
      const retryButton = document.getElementById("retryBtn");
      const status = document.getElementById("connectionStatus");
      const statusText = document.getElementById("statusText");
      const announcement = document.getElementById("announcement");

      let retryTimer = null;

      function updateConnectionStatus(isOnline) {
        status.classList.toggle("online", isOnline);
        statusText.textContent = isOnline ? "Connection restored" : "Offline";
      }

      function announce(message) {
        announcement.textContent = "";
        requestAnimationFrame(() => {
          announcement.textContent = message;
        });
      }

      function retry() {
        if (retryTimer) {
          clearTimeout(retryTimer);
        }

        retryButton.disabled = true;
        retryButton.textContent = "Checking…";
        announce("Checking your connection.");

        if (navigator.onLine) {
          location.reload();
          return;
        }

        retryTimer = setTimeout(() => {
          retryButton.disabled = false;
          retryButton.textContent = "🔄 Try again";
          announce("The connection is still offline.");
        }, 1200);
      }

      retryButton.addEventListener("click", retry);

      window.addEventListener("online", () => {
        updateConnectionStatus(true);
        announce("Connection restored. Returning to Farmium.");
        location.reload();
      });

      window.addEventListener("offline", () => {
        updateConnectionStatus(false);
        announce("The connection has been lost.");
      });

      updateConnectionStatus(navigator.onLine);
    })();
  </script>
</body>

</html>
